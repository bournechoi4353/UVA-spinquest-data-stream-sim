    id_column: id
    time_column: Timestamp
    time_type: timestamp
    time_zone: UTC  # MySQL timestamp is stored in UTC, read with session time_zone +00:00
    time_zone_assumed: false
    timestamp_resolution_s: 1
    include: true
    nominal_period_s: 1.354  # measured mean spacing while running (row-count average was 2.28)
    channels:
      - {db_column: seperator_flow, display_name: "Separator flow", unit: null, group: flow, group_inferred: true, role: sensor, registry_status: named}
      - {db_column: magnet_flow, display_name: "Magnet flow", unit: null, group: flow, group_inferred: true, role: sensor, registry_status: named}
