# Layout of the real ptdb MySQL database (Phase R1).
# Source: section 3 of real-data-alignment-prompt.md. Column names keep their real spelling,
# including the typos seperator and buffle. Every unit is null until confirmed (section 3.4).
# Groups are inferred from column and table names (group_inferred: true). For QT the group
# comes from the instrument tag prefix (ti temperature, pt pressure, fc flow), which is a guess.
# nominal_period_s values are averages from row counts and assume the logger never paused.
# They will be replaced by measured spacing from the profiler (Phase R4).
#
# Open items (section 3, not yet filled in):
# Measured by the read-only profiler (2026-11-03, aggregates only):
# - server 10.3.39-MariaDB, @@system_time_zone EDT (so datetime columns are taken as America/New_York)
# - the logger was down for about 248 of 368 days (longest gap 2026-03-03 to 2026-08-13)
# - nominal_period_s below is the measured mean spacing while the logger runs
# - many NULLs (Flow_Rates 40 to 64 percent, Labjack 53 percent) and 19 to 40 percent shared timestamps:
#   rows look like partial rows from more than one writer in the same second
# - every Lakeshore_Fridge_Temp channel read exactly 0 in all samples: the mentor confirmed the
#   sensors are not connected yet, so that feed is deferred. QT is included instead (its sensors
#   are finalized); its period is provisional until QT is profiled.
# - TODO: SHOW CREATE TABLE for tables other than Labjack, Flow_Rates, Lakeshore_Fridge_Temp
#   (assumed here: same id primary key and Timestamp index)
# - TODO: sentinel value convention for failed reads (root_exhaust_pressure has a median of -41030.7,
#   which looks like one)
# - TODO: row counts and time ranges for the deferred and excluded tables
# - TODO: whether the logger is still writing after 2026-08-17

version: 1
database: ptdb
tables:
